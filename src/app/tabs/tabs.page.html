<ion-tabs>
  <!-- id="main-tab-bar" is the positionAnchor target for bottom-positioned
       toasts so they appear above the tab bar instead of behind it. -->
  <ion-tab-bar slot="bottom" id="main-tab-bar">
    <ion-tab-button tab="feed" href="/tabs/feed" (click)="onTabTap('feed')" [class.tab-bouncing]="activatingTab() === 'feed'">
      <ion-icon aria-hidden="true" name="restaurant-outline"></ion-icon>
      <ion-label>Feed</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="create" href="/tabs/create" (click)="onTabTap('create')" [class.tab-bouncing]="activatingTab() === 'create'">
      <ion-icon aria-hidden="true" name="add-circle-outline"></ion-icon>
      <ion-label>Create</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/tabs/profile" (click)="onTabTap('profile')" [class.tab-bouncing]="activatingTab() === 'profile'">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
